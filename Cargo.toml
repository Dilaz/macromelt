[package]
name = "macromelt"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Decoder for Macromedia Director Shockwave 3D cast members (XMED / W3D): CLOD meshes, skins, motions, textures and materials, baked to glTF 2.0"
license = "Apache-2.0"
repository = "https://github.com/Dilaz/macromelt"
readme = "README.md"
keywords = ["director", "shockwave", "w3d", "gltf", "reverse-engineering"]
categories = [
	"parser-implementations",
	"command-line-utilities",
	"rendering::data-formats",
]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:env_logger"]

[[bin]]
name = "macromelt"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
flate2 = "1.1.10"
log = "0.4"
nom = "8.0.0"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2"
zune-jpeg = "0.5.15"
clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
